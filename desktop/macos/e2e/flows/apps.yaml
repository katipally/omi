version: 2
name: apps
tier: manual
description: Apps/Integrations marketplace flow — browse apps, filter by category, search, view app details
app: com.omi.computer-macos
covers:
  - desktop/macos/Desktop/Sources/MainWindow/Pages/AppsPage.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/AppsPageFilterControls.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/AppInstallControls.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/SearchableDropdown.swift
  - desktop/macos/Desktop/Sources/MainWindow/ModalPresentationState.swift
  - desktop/macos/Desktop/Sources/Theme/OmiModal.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/ManualInstallationDisclosure.swift
  - desktop/macos/Desktop/Sources/ConferencingApps.swift
  - desktop/macos/Desktop/Sources/ConnectorBrandIcon.swift
preconditions:
  - auth_ready

steps:
  - id: S1
    name: Navigate to Apps page
    do: "Click the Apps sidebar icon (identifier: sidebar_apps) to navigate to the Apps/Integrations page. Verify the marketplace loads with app cards, search bar, the All/Installed segmented control (All selected), category filter, and the Create App button."
    expect:
      interactive_count: { min: 10 }
      text_visible:
        - Apps

  - id: S2
    name: Filter by category
    do: "Click the 'Category' menu button to open the category dropdown. Select a category (e.g., 'Productivity' or 'Memory') to filter the app list."
    expect:
      interactive_count: { min: 5 }

  - id: S3
    name: Search for an app
    do: "Click the search text field at the top of the Apps page. Type 'note' to search for note-taking apps. Verify the app list filters to matching results."
    expect:
      interactive_count: { min: 3 }

  - id: S4
    name: View Installed apps
    do: "Click the 'Installed' segment of the All/Installed control. Verify it becomes the selected segment and the view shows currently installed/enabled integrations, or the 'No installed apps' empty state when none are installed."
    expect:
      interactive_count: { min: 3 }

  - id: S5
    name: Return to all apps
    do: "Click the 'All' segment of the All/Installed control. Verify all app cards are visible again and that the search text and the category selection from the earlier steps are still applied — 'All' must widen the install scope only, never clear the other filters."
    expect:
      interactive_count: { min: 5 }

  - id: S6
    name: Return to Dashboard
    do: "Click the Dashboard sidebar icon (identifier: sidebar_dashboard) to return to the Dashboard page."
    expect:
      interactive_count: { min: 5 }
      text_visible:
        - Dashboard
