version: 2
name: home-stage
tier: 2
description: Home stage transitions (hub/chat/connect) via automation bridge
app: non-prod
covers:
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatMessagesView.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatBubble.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatLiveEdgeFollower.swift
  - desktop/macos/Desktop/Sources/Chat/ChatStreamingReveal.swift
  - desktop/macos/Desktop/Sources/Chat/ChatOmiMark.swift
  - desktop/macos/Desktop/Sources/Chat/TypingIndicator.swift
  - desktop/macos/Desktop/Sources/Chat/AgentLifecycleDisplayProjection.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/DashboardPage.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/HomeAskBar.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/HomeStagePresentation.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/HomeChatRevealMonitor.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/HomeStatusControls.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/HomeSuggestionsStore.swift
  - desktop/macos/Desktop/Sources/MainWindow/Dashboard/HomeKnowsComposer.swift
  - desktop/macos/Desktop/Sources/MainWindow/MainChatNavigationRequest.swift
  - desktop/macos/Desktop/Sources/DesktopAutomationBridge.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatPromptTimeline.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatPromptTimelineModel.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatTranscriptGeometry.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/ChatScrollBehavior.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/HomeStageLayout.swift
  - desktop/macos/Desktop/Sources/MainWindow/Pages/HomeConnectComponents.swift
preconditions:
  - automation_bridge_ready

steps:
  - id: S0
    name: Reset main chat for flow isolation
    bridge.action:
      name: reset_main_chat
    expect:
      result.detail.reset: "true"

  - id: S1
    name: Navigate to Dashboard
    bridge.navigate:
      target: dashboard
      activateApp: false
    wait:
      state.selectedTabIndex: 0

  # Home opens on the hub, every time. No action here on purpose: the point is
  # that arriving at Dashboard rests on `hub` without anything nudging it, so a
  # background history restore that auto-reveals the transcript fails the flow.
  # A bare `wait:` is not a typed harness operation, so this step could only
  # ever error — it never asserted the resting mode it is named for.
  - id: S2
    name: Home opens on the hub
    state.expect:
      state.homeMode: hub

  - id: S3
    name: Open inline chat
    bridge.action:
      name: home_open_chat
    wait:
      state.homeMode: chat

  - id: S4
    name: Home ask stub (no LLM wait)
    bridge.action:
      name: home_ask
      params:
        query: "[[MARKER:home-stage-stub]]"
    expect:
      result.detail.sent: "[[MARKER:home-stage-stub]]"
    wait:
      state.homeMode: chat

  # The ask in S4 is what drives the transcript render path end to end: the row
  # inserts through ChatBubble, the reply reveals through ChatStreamingReveal,
  # and the working mark and live-edge follow run alongside it. Asserting the
  # turn landed is what makes those `covers:` entries mean something.
  - id: S4a
    name: Wait for the turn to settle
    bridge.action:
      name: wait_main_chat_idle
      params:
        timeoutMs: "120000"
    expect:
      result.detail.idle: "true"

  - id: S4b
    name: The sent turn reaches the transcript
    bridge.action:
      name: main_chat_snapshot
    expect:
      # S0 reset the chat, so a count of two is exactly this turn's user row and
      # its reply — both rendered through ChatBubble, the reply through the
      # paced reveal.
      result.detail.message_count: "2"
      result.detail.is_streaming: "false"

  - id: S5
    name: Toggle connect tray
    bridge.action:
      name: home_connect_toggle
    wait:
      state.homeMode: connect

  - id: S6
    name: Collapse back to the hub
    bridge.action:
      name: home_close_panel
    wait:
      state.homeMode: hub

  - id: S7
    name: Logs clean
    log.expect:
      absent:
        - "DesktopAutomationBridge: failed"
