version: 2
name: navigation
tier: manual
description: Top navigation bar smoke — verify all 4 tabs + Settings gear + Rewind overlay load correctly (v0.12.119+ redesign)
app: com.omi.computer-macos
covers:
  - desktop/macos/Desktop/Sources/OmiApp.swift
  - desktop/macos/Desktop/Sources/MainWindow/SidebarView.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopHomeView.swift
  - desktop/macos/Desktop/Sources/MainWindow/HubPages.swift
  - desktop/macos/Desktop/Sources/MainWindow/DesktopTopBar.swift
  - desktop/macos/Desktop/Sources/MainWindow/SettingsSidebar.swift
  - desktop/macos/Desktop/Sources/Theme/OmiSegmentedControl.swift
  - desktop/macos/Desktop/Sources/Theme/OmiChip.swift
  - desktop/macos/Desktop/Sources/Theme/OmiIconButton.swift
  - desktop/macos/Desktop/Sources/Theme/OmiFilterChip.swift
  - desktop/macos/Desktop/Sources/Theme/OmiPageHeader.swift
  - desktop/macos/Desktop/Sources/Theme/OmiFloatingStatusPill.swift
  - desktop/macos/Desktop/Sources/Theme/OmiChrome.swift
  - desktop/macos/Desktop/Sources/MainWindow/Components/OmiSearchField.swift
preconditions:
  - auth_ready

steps:
  - id: S1
    name: Verify Home tab loads
    do: "Verify the app is on the Home tab. The header has two rows: the Omi mark and wordmark centered on top with a Settings chip on the left (clear of the traffic lights) and Capture / Listening on the right, and a segmented control below with 4 segments: Home, Memory, Tasks, Apps. Home content should show the hub (rotating Omi mark, a greeting headline, a short daily brief, and a few suggestion rows) with the composer docked beneath it."
    expect:
      interactive_count: { min: 8 }
      text_visible:
        - Home
        - Memory
        - Tasks
        - Apps

  - id: S2
    name: Navigate to Memory
    do: "Click the Memory button in the top nav bar (agent-swift find text 'Memory' click). Verify Memory page loads with 3 sub-tabs: Memories, Conversations, Brain Map."
    expect:
      text_visible:
        - Memories
        - Conversations
        - Brain Map

  - id: S3
    name: Navigate to Tasks
    do: "Click the Tasks button in the top nav bar (agent-swift find text 'Tasks' click). Verify Tasks page loads with search bar and task list."
    expect:
      text_visible:
        - Tasks

  - id: S4
    name: Navigate to Apps
    do: "Click the Apps button in the top nav bar (agent-swift find text 'Apps' click). Verify Apps page loads with Imports and Exports sections."
    expect:
      text_visible:
        - Apps
        - Imports

  - id: S5
    name: Open Settings via gear icon
    do: "Click the Settings chip on the left of the header (agent-swift find text 'Settings' click). Verify the frosted settings sidebar slides in from the left showing section names: General, Account & Plan, Transcription, Floating Bar, Notifications & Privacy, Rewind, Shortcuts, Advanced, About."
    expect:
      interactive_count: { min: 9 }
      text_visible:
        - Settings
        - General

  - id: S6
    name: Return to Home from Settings
    do: "Click the 'Back to app' chip at the top of the settings sidebar (agent-swift find text 'Back to app' click). Verify it returns to the tab you came from with the two-row header visible."
    expect:
      text_visible:
        - Home

  - id: S7
    name: Open Rewind via View menu
    do: "Open Rewind via View menu (agent-swift press on View > Rewind menu item, or use keyboard shortcut ⌘⌥R). Verify Rewind overlay appears with search bar, date picker, and either timeline content or 'Screen Recording Permission Required' gate."
    expect:
      text_visible:
        - Rewind

  - id: S8
    name: Return to Home
    do: "Click the 'Back' chip in the Rewind header (agent-swift find text 'Back' click) and verify it returns to the tab Rewind was opened from, with the two-row header visible."
    expect:
      text_visible:
        - Home
